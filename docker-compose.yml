services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kg-neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol (Integration)
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./ontologies:/var/lib/neo4j/import/ontologies
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    image: quay.io/jupyter/minimal-notebook:latest
    container_name: kg-jupyter
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./ontologies:/home/jovyan/ontologies
    command: >
      bash -c "pip install -q neo4j rdflib owlrl pandas &&
      start-notebook.py --IdentityProvider.token=''"
